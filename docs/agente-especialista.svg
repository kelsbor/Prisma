<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Agente Especialista</title>
  <desc>Indexar: a base é dividida em pedaços, vira vetores e vai para o Chroma. Perguntar: a pergunta vira vetor, o Chroma traz os trechos, o filtro de nota mantém os relevantes e, com chave, o Gemini escreve a resposta com o resumo do mês e o perfil de risco.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 15px; font-weight: 600; }  .s { font-size: 12.5px; }  .l { font-size: 12px; fill: #5F5E5A; }
      .g { font-size: 13px; font-weight: 600; fill: #5F5E5A; }
      .ag rect { fill: #EEEDFE; stroke: #534AB7; } .ag .t { fill: #3C3489; } .ag .s { fill: #534AB7; }
      .dd rect { fill: #E1F5EE; stroke: #0F6E56; } .dd .t { fill: #085041; } .dd .s { fill: #0F6E56; }
      .nt rect { fill: #F1EFE8; stroke: #5F5E5A; } .nt .t { fill: #2C2C2A; } .nt .s { fill: #444441; }
      .rn rect { fill: #FAEEDA; stroke: #854F0B; } .rn .t { fill: #633806; } .rn .s { fill: #854F0B; }
      .ex rect { fill: #FFFFFF; stroke: #5F5E5A; stroke-dasharray: 6 4; } .ex .t { fill: #2C2C2A; } .ex .s { fill: #444441; }
      .seta { stroke: #5F5E5A; stroke-width: 1.4; fill: none; }  .trac { stroke-dasharray: 6 4; }
      .grupo { fill: none; stroke: #B4B2A9; stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect width="1000" height="640" fill="#FFFFFF"/>
  <rect class="grupo" x="20" y="18" width="960" height="120" rx="10"/><text class="g" x="34" y="38">indexar · ./prisma.sh indexar</text>
  <g class="dd"><rect x="40" y="62" width="200" height="56" rx="8"/><text class="t" x="140.0" y="86.0" text-anchor="middle">base_conhecimento/</text><text class="s" x="140.0" y="105.0" text-anchor="middle">37 materiais em JSONL</text></g>
  <g class="nt"><rect x="280" y="62" width="200" height="56" rx="8"/><text class="t" x="380.0" y="86.0" text-anchor="middle">Limpar e dividir</text><text class="s" x="380.0" y="105.0" text-anchor="middle">pedaços de 800 caracteres</text></g>
  <g class="nt"><rect x="520" y="62" width="200" height="56" rx="8"/><text class="t" x="620.0" y="86.0" text-anchor="middle">Embeddings</text><text class="s" x="620.0" y="105.0" text-anchor="middle">local ou Gemini</text></g>
  <g class="dd"><rect x="760" y="62" width="200" height="56" rx="8"/><text class="t" x="860.0" y="86.0" text-anchor="middle">Chroma</text><text class="s" x="860.0" y="105.0" text-anchor="middle">~/.prisma/rag/&lt;modo&gt;</text></g>
  <path class="seta" d="M240 90 L276 90" marker-end="url(#seta)"/>
  <path class="seta" d="M480 90 L516 90" marker-end="url(#seta)"/>
  <path class="seta" d="M720 90 L756 90" marker-end="url(#seta)"/>
  <rect class="grupo" x="20" y="170" width="960" height="410" rx="10"/><text class="g" x="34" y="190">perguntar · ./prisma.sh especialista perguntar</text>
  <g class="ag"><rect x="40" y="214" width="200" height="56" rx="8"/><text class="t" x="140.0" y="238.0" text-anchor="middle">Pergunta</text><text class="s" x="140.0" y="257.0" text-anchor="middle">com ou sem --titular</text></g>
  <g class="nt"><rect x="280" y="214" width="200" height="56" rx="8"/><text class="t" x="380.0" y="238.0" text-anchor="middle">Embedding</text><text class="s" x="380.0" y="257.0" text-anchor="middle">o mesmo modelo do índice</text></g>
  <g class="nt"><rect x="520" y="214" width="200" height="56" rx="8"/><text class="t" x="620.0" y="238.0" text-anchor="middle">Busca no Chroma</text><text class="s" x="620.0" y="257.0" text-anchor="middle">4 trechos mais parecidos</text></g>
  <g class="nt"><rect x="760" y="214" width="200" height="56" rx="8"/><text class="t" x="860.0" y="238.0" text-anchor="middle">Filtro de nota</text><text class="s" x="860.0" y="257.0" text-anchor="middle">PRISMA_NOTA_MINIMA</text></g>
  <path class="seta" d="M240 242 L276 242" marker-end="url(#seta)"/>
  <path class="seta" d="M480 242 L516 242" marker-end="url(#seta)"/>
  <path class="seta" d="M720 242 L756 242" marker-end="url(#seta)"/>
  <path class="seta" d="M860 118 L860 150 L620 150 L620 210" marker-end="url(#seta)"/>
  <g class="ag"><rect x="40" y="340" width="200" height="56" rx="8"/><text class="t" x="140.0" y="364.0" text-anchor="middle">Resumo do mês</text><text class="s" x="140.0" y="383.0" text-anchor="middle">Armazenamento + Python</text></g>
  <g class="ag"><rect x="280" y="340" width="200" height="56" rx="8"/><text class="t" x="380.0" y="364.0" text-anchor="middle">Perfil de risco</text><text class="s" x="380.0" y="383.0" text-anchor="middle">Agente de Risco</text></g>
  <g class="nt"><rect x="520" y="340" width="200" height="56" rx="8"/><text class="t" x="620.0" y="364.0" text-anchor="middle">Monta o prompt</text><text class="s" x="620.0" y="383.0" text-anchor="middle">regras, dados e trechos</text></g>
  <g class="nt"><rect x="760" y="340" width="200" height="56" rx="8"/><text class="t" x="860.0" y="364.0" text-anchor="middle">GOOGLE_API_KEY?</text><text class="s" x="860.0" y="383.0" text-anchor="middle">chave preenchida no .env</text></g>
  <path class="seta" d="M860 270 L860 300 L620 300 L620 336" marker-end="url(#seta)"/>
  <path class="seta" d="M480 368 L516 368" marker-end="url(#seta)"/>
  <path class="seta" d="M140 396 L140 424 L580 424 L580 400" marker-end="url(#seta)"/>
  <path class="seta" d="M720 368 L756 368" marker-end="url(#seta)"/>
  <g class="ex"><rect x="580" y="480" width="190" height="56" rx="8"/><text class="t" x="675.0" y="504.0" text-anchor="middle">Gemini escreve</text><text class="s" x="675.0" y="523.0" text-anchor="middle">resposta com fontes</text></g>
  <g class="ag"><rect x="800" y="480" width="160" height="56" rx="8"/><text class="t" x="880.0" y="504.0" text-anchor="middle">Só os trechos</text><text class="s" x="880.0" y="523.0" text-anchor="middle">com fonte e página</text></g>
  <path class="seta" d="M800 396 L800 440 L675 440 L675 476" marker-end="url(#seta)"/>
  <text class="l" x="690" y="460" text-anchor="start">sim</text>
  <path class="seta" d="M910 396 L910 476" marker-end="url(#seta)"/>
  <text class="l" x="918" y="444" text-anchor="start">não</text>
  <rect x="40" y="601" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text class="l" x="60" y="612">dados na máquina</text>
  <rect x="200.0" y="601" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text class="l" x="220.0" y="612">etapa em Python</text>
  <rect x="353.0" y="601" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text class="l" x="373.0" y="612">agente ou ferramenta MCP</text>
  <rect x="569.0" y="601" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-dasharray="4 3"/><text class="l" x="589.0" y="612">fora da máquina ou opcional</text>
</svg>
