<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Agente Coletor</title>
  <desc>Lê extratos por formato, normaliza, confere a qualidade, consolida os arquivos e, no importar, envia em lotes ao Agente de Armazenamento.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 15px; font-weight: 600; }  .s { font-size: 12.5px; }  .l { font-size: 12px; fill: #5F5E5A; }
      .g { font-size: 13px; font-weight: 600; fill: #5F5E5A; }
      .ag rect { fill: #EEEDFE; stroke: #534AB7; } .ag .t { fill: #3C3489; } .ag .s { fill: #534AB7; }
      .dd rect { fill: #E1F5EE; stroke: #0F6E56; } .dd .t { fill: #085041; } .dd .s { fill: #0F6E56; }
      .nt rect { fill: #F1EFE8; stroke: #5F5E5A; } .nt .t { fill: #2C2C2A; } .nt .s { fill: #444441; }
      .rn rect { fill: #FAEEDA; stroke: #854F0B; } .rn .t { fill: #633806; } .rn .s { fill: #854F0B; }
      .ex rect { fill: #FFFFFF; stroke: #5F5E5A; stroke-dasharray: 6 4; } .ex .t { fill: #2C2C2A; } .ex .s { fill: #444441; }
      .seta { stroke: #5F5E5A; stroke-width: 1.4; fill: none; }  .trac { stroke-dasharray: 6 4; }
      .grupo { fill: none; stroke: #B4B2A9; stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect width="1000" height="450" fill="#FFFFFF"/>
  <g class="nt"><rect x="40" y="40" width="200" height="56" rx="8"/><text class="t" x="140.0" y="64.0" text-anchor="middle">Extratos</text><text class="s" x="140.0" y="83.0" text-anchor="middle">CSV, TXT, XLSX, OFX, PDF</text></g>
  <g class="nt"><rect x="290" y="40" width="200" height="56" rx="8"/><text class="t" x="390.0" y="64.0" text-anchor="middle">Ler por formato</text><text class="s" x="390.0" y="83.0" text-anchor="middle">estruturados: lidos aqui</text></g>
  <g class="nt"><rect x="540" y="40" width="190" height="56" rx="8"/><text class="t" x="635.0" y="64.0" text-anchor="middle">Normalizar</text><text class="s" x="635.0" y="83.0" text-anchor="middle">datas, valores e sinais</text></g>
  <g class="nt"><rect x="780" y="40" width="190" height="56" rx="8"/><text class="t" x="875.0" y="64.0" text-anchor="middle">Conferir</text><text class="s" x="875.0" y="83.0" text-anchor="middle">alertas e conciliação</text></g>
  <g class="ex"><rect x="290" y="180" width="200" height="56" rx="8"/><text class="t" x="390.0" y="204.0" text-anchor="middle">DocStrange</text><text class="s" x="390.0" y="223.0" text-anchor="middle">PDF escaneado e imagem</text></g>
  <g class="ag"><rect x="540" y="180" width="190" height="56" rx="8"/><text class="t" x="635.0" y="204.0" text-anchor="middle">analisar</text><text class="s" x="635.0" y="223.0" text-anchor="middle">relatório, nada gravado</text></g>
  <g class="nt"><rect x="780" y="180" width="190" height="56" rx="8"/><text class="t" x="875.0" y="204.0" text-anchor="middle">Consolidar</text><text class="s" x="875.0" y="223.0" text-anchor="middle">data + valor + ordem</text></g>
  <g class="ag"><rect x="540" y="320" width="190" height="56" rx="8"/><text class="t" x="635.0" y="344.0" text-anchor="middle">importar</text><text class="s" x="635.0" y="363.0" text-anchor="middle">lotes de 200</text></g>
  <g class="ag"><rect x="40" y="320" width="200" height="56" rx="8"/><text class="t" x="140.0" y="344.0" text-anchor="middle">Armazenamento</text><text class="s" x="140.0" y="363.0" text-anchor="middle">não grava duas vezes</text></g>
  <path class="seta" d="M240 68 L286 68" marker-end="url(#seta)"/>
  <path class="seta" d="M490 68 L536 68" marker-end="url(#seta)"/>
  <path class="seta" d="M730 68 L776 68" marker-end="url(#seta)"/>
  <path class="seta" d="M875 96 L875 176" marker-end="url(#seta)"/>
  <path class="seta trac" d="M390 96 L390 176" marker-end="url(#seta)"/>
  <text class="l" x="398" y="140" text-anchor="start">opcional</text>
  <path class="seta" d="M780 208 L734 208" marker-end="url(#seta)"/>
  <path class="seta" d="M875 236 L875 348 L734 348" marker-end="url(#seta)"/>
  <path class="seta" d="M540 348 L244 348" marker-end="url(#seta)"/>
  <text class="l" x="392" y="340" text-anchor="middle">salvar_lote (MCP)</text>
  <rect x="40" y="411" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text class="l" x="60" y="422">etapa em Python</text>
  <rect x="193.0" y="411" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-dasharray="4 3"/><text class="l" x="213.0" y="422">fora da máquina ou opcional</text>
  <rect x="430.0" y="411" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text class="l" x="450.0" y="422">agente ou ferramenta MCP</text>
</svg>
