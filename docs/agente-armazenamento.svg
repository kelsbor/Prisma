<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Agente de Armazenamento</title>
  <desc>Salvar pseudonimiza o titular com HMAC, criptografa os dados com Fernet e evita duplicatas pela chave; consultar busca pelo HMAC e descriptografa; eliminar apaga tudo do titular.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 15px; font-weight: 600; }  .s { font-size: 12.5px; }  .l { font-size: 12px; fill: #5F5E5A; }
      .g { font-size: 13px; font-weight: 600; fill: #5F5E5A; }
      .ag rect { fill: #EEEDFE; stroke: #534AB7; } .ag .t { fill: #3C3489; } .ag .s { fill: #534AB7; }
      .dd rect { fill: #E1F5EE; stroke: #0F6E56; } .dd .t { fill: #085041; } .dd .s { fill: #0F6E56; }
      .nt rect { fill: #F1EFE8; stroke: #5F5E5A; } .nt .t { fill: #2C2C2A; } .nt .s { fill: #444441; }
      .rn rect { fill: #FAEEDA; stroke: #854F0B; } .rn .t { fill: #633806; } .rn .s { fill: #854F0B; }
      .ex rect { fill: #FFFFFF; stroke: #5F5E5A; stroke-dasharray: 6 4; } .ex .t { fill: #2C2C2A; } .ex .s { fill: #444441; }
      .seta { stroke: #5F5E5A; stroke-width: 1.4; fill: none; }  .trac { stroke-dasharray: 6 4; }
      .grupo { fill: none; stroke: #B4B2A9; stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect width="1000" height="520" fill="#FFFFFF"/>
  <g class="ag"><rect x="40" y="40" width="240" height="56" rx="8"/><text class="t" x="160.0" y="64.0" text-anchor="middle">Salvar</text><text class="s" x="160.0" y="83.0" text-anchor="middle">salvar_lote · salvar_transacao</text></g>
  <g class="ag"><rect x="40" y="310" width="240" height="56" rx="8"/><text class="t" x="160.0" y="334.0" text-anchor="middle">Consultar</text><text class="s" x="160.0" y="353.0" text-anchor="middle">consultar_titular</text></g>
  <g class="ag"><rect x="40" y="400" width="240" height="56" rx="8"/><text class="t" x="160.0" y="424.0" text-anchor="middle">Eliminar</text><text class="s" x="160.0" y="443.0" text-anchor="middle">eliminar_titular</text></g>
  <g class="nt"><rect x="340" y="40" width="300" height="56" rx="8"/><text class="t" x="490.0" y="64.0" text-anchor="middle">Titular vira HMAC</text><text class="s" x="490.0" y="83.0" text-anchor="middle">ID sem pontuação, nunca em claro</text></g>
  <g class="nt"><rect x="340" y="130" width="300" height="56" rx="8"/><text class="t" x="490.0" y="154.0" text-anchor="middle">Dados viram Fernet</text><text class="s" x="490.0" y="173.0" text-anchor="middle">o JSON inteiro é criptografado</text></g>
  <g class="nt"><rect x="340" y="220" width="300" height="56" rx="8"/><text class="t" x="490.0" y="244.0" text-anchor="middle">Chave vira HMAC</text><text class="s" x="490.0" y="263.0" text-anchor="middle">a mesma transação não entra 2 vezes</text></g>
  <g class="nt"><rect x="340" y="310" width="300" height="56" rx="8"/><text class="t" x="490.0" y="334.0" text-anchor="middle">Fernet vira JSON</text><text class="s" x="490.0" y="353.0" text-anchor="middle">descriptografa só na consulta</text></g>
  <g class="dd"><rect x="710" y="40" width="250" height="56" rx="8"/><text class="t" x="835.0" y="64.0" text-anchor="middle">chaves.json</text><text class="s" x="835.0" y="83.0" text-anchor="middle">~/.prisma · permissão 600</text></g>
  <g class="dd"><rect x="710" y="220" width="250" height="56" rx="8"/><text class="t" x="835.0" y="244.0" text-anchor="middle">SQLite · registros</text><text class="s" x="835.0" y="263.0" text-anchor="middle">~/.prisma/dados.db</text></g>
  <path class="seta" d="M280 68 L336 68" marker-end="url(#seta)"/>
  <path class="seta" d="M490 96 L490 126" marker-end="url(#seta)"/>
  <path class="seta" d="M490 186 L490 216" marker-end="url(#seta)"/>
  <path class="seta" d="M640 248 L706 248" marker-end="url(#seta)"/>
  <text class="l" x="673" y="240" text-anchor="middle">grava</text>
  <path class="seta" d="M710 68 L644 68" marker-end="url(#seta)"/>
  <text class="l" x="677" y="60" text-anchor="middle">chaves</text>
  <path class="seta" d="M835 276 L835 338 L644 338" marker-end="url(#seta)"/>
  <text class="l" x="740" y="330" text-anchor="middle">busca pelo HMAC</text>
  <path class="seta" d="M340 338 L284 338" marker-end="url(#seta)"/>
  <path class="seta" d="M280 428 L910 428 L910 280" marker-end="url(#seta)"/>
  <text class="l" x="595" y="420" text-anchor="middle">apaga tudo do titular (LGPD, art. 18)</text>
  <rect x="40" y="481" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text class="l" x="60" y="492">agente ou ferramenta MCP</text>
  <rect x="256.0" y="481" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text class="l" x="276.0" y="492">etapa em Python</text>
  <rect x="409.0" y="481" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text class="l" x="429.0" y="492">dados na máquina</text>
</svg>
