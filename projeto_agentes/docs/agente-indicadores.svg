<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Agente de Indicadores</title>
  <desc>O Especialista e o Orientador chamam as ferramentas MCP do Agente de Indicadores; as contas são feitas em Python sobre dados do Banco Central, guardados em cache por 12 horas. Só os códigos das séries saem da máquina.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 15px; font-weight: 600; }  .s { font-size: 12.5px; }  .l { font-size: 12px; fill: #5F5E5A; }
      .g { font-size: 13px; font-weight: 600; fill: #5F5E5A; }
      .ag rect { fill: #EEEDFE; stroke: #534AB7; } .ag .t { fill: #3C3489; } .ag .s { fill: #534AB7; }
      .dd rect { fill: #E1F5EE; stroke: #0F6E56; } .dd .t { fill: #085041; } .dd .s { fill: #0F6E56; }
      .nt rect { fill: #F1EFE8; stroke: #5F5E5A; } .nt .t { fill: #2C2C2A; } .nt .s { fill: #444441; }
      .rn rect { fill: #FAEEDA; stroke: #854F0B; } .rn .t { fill: #633806; } .rn .s { fill: #854F0B; }
      .ex rect { fill: #FFFFFF; stroke: #5F5E5A; stroke-dasharray: 6 4; } .ex .t { fill: #2C2C2A; } .ex .s { fill: #444441; }
      .seta { stroke: #5F5E5A; stroke-width: 1.4; fill: none; }  .trac { stroke-dasharray: 6 4; }
      .grupo { fill: none; stroke: #B4B2A9; stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect width="1000" height="380" fill="#FFFFFF"/>
  <g class="ag"><rect x="40" y="60" width="240" height="56" rx="8"/><text class="t" x="160.0" y="84.0" text-anchor="middle">Especialista e Orientador</text><text class="s" x="160.0" y="103.0" text-anchor="middle">pedem por MCP</text></g>
  <g class="ag"><rect x="330" y="60" width="290" height="56" rx="8"/><text class="t" x="475.0" y="84.0" text-anchor="middle">Ferramentas MCP</text><text class="s" x="475.0" y="103.0" text-anchor="middle">juros, indicador, simular, histórico</text></g>
  <g class="nt"><rect x="670" y="60" width="290" height="56" rx="8"/><text class="t" x="815.0" y="84.0" text-anchor="middle">Contas em Python</text><text class="s" x="815.0" y="103.0" text-anchor="middle">comparação, simulação, teto legal</text></g>
  <g class="dd"><rect x="330" y="200" width="270" height="56" rx="8"/><text class="t" x="465.0" y="224.0" text-anchor="middle">Cache local</text><text class="s" x="465.0" y="243.0" text-anchor="middle">~/.prisma/indicadores · 12 h</text></g>
  <g class="ex"><rect x="690" y="200" width="270" height="56" rx="8"/><text class="t" x="825.0" y="224.0" text-anchor="middle">API do Banco Central</text><text class="s" x="825.0" y="243.0" text-anchor="middle">SGS · pública, sem chave</text></g>
  <path class="seta" d="M280 88 L326 88" marker-end="url(#seta)"/>
  <path class="seta" d="M620 88 L666 88" marker-end="url(#seta)"/>
  <path class="seta" d="M815 116 L815 160 L475 160 L475 196" marker-end="url(#seta)"/>
  <path class="seta" d="M600 228 L686 228" marker-end="url(#seta)"/>
  <text class="l" x="643" y="220" text-anchor="middle">vencido</text>
  <rect class="grupo" x="330" y="290" width="630" height="34" rx="10"/><text class="g" x="344" y="310">sai da máquina: só o código da série (ex.: 22022); nenhum dado da pessoa</text>
  <rect x="40" y="341" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text class="l" x="60" y="352">agente ou ferramenta MCP</text>
  <rect x="256.0" y="341" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text class="l" x="276.0" y="352">etapa em Python</text>
  <rect x="409.0" y="341" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text class="l" x="429.0" y="352">dados na máquina</text>
  <rect x="569.0" y="341" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-dasharray="4 3"/><text class="l" x="589.0" y="352">fora da máquina ou opcional</text>
</svg>
