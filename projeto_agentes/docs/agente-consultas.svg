<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Agente de Consultas</title>
  <desc>Perguntas sobre os gastos respondidas com SQL, com o código do assistente do PrismaAPP: filtro de manipulação, Gemini escreve o SQL, validação, execução somente leitura no banco da Pluggy, Gemini redige e o guardião confere que todo valor em R$ existe no resultado.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 15px; font-weight: 600; }  .s { font-size: 12.5px; }  .l { font-size: 12px; fill: #5F5E5A; }
      .g { font-size: 13px; font-weight: 600; fill: #5F5E5A; }
      .ag rect { fill: #EEEDFE; stroke: #534AB7; } .ag .t { fill: #3C3489; } .ag .s { fill: #534AB7; }
      .dd rect { fill: #E1F5EE; stroke: #0F6E56; } .dd .t { fill: #085041; } .dd .s { fill: #0F6E56; }
      .nt rect { fill: #F1EFE8; stroke: #5F5E5A; } .nt .t { fill: #2C2C2A; } .nt .s { fill: #444441; }
      .rn rect { fill: #FAEEDA; stroke: #854F0B; } .rn .t { fill: #633806; } .rn .s { fill: #854F0B; }
      .ex rect { fill: #FFFFFF; stroke: #5F5E5A; stroke-dasharray: 6 4; } .ex .t { fill: #2C2C2A; } .ex .s { fill: #444441; }
      .seta { stroke: #5F5E5A; stroke-width: 1.4; fill: none; }  .trac { stroke-dasharray: 6 4; }
      .grupo { fill: none; stroke: #B4B2A9; stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect width="1000" height="360" fill="#FFFFFF"/>
  <g class="ag"><rect x="40" y="40" width="200" height="56" rx="8"/><text class="t" x="140.0" y="64.0" text-anchor="middle">Pergunta</text><text class="s" x="140.0" y="83.0" text-anchor="middle">até 300 caracteres</text></g>
  <g class="nt"><rect x="280" y="40" width="200" height="56" rx="8"/><text class="t" x="380.0" y="64.0" text-anchor="middle">Filtro</text><text class="s" x="380.0" y="83.0" text-anchor="middle">bloqueia manipulação</text></g>
  <g class="ex"><rect x="520" y="40" width="200" height="56" rx="8"/><text class="t" x="620.0" y="64.0" text-anchor="middle">Gemini escreve SQL</text><text class="s" x="620.0" y="83.0" text-anchor="middle">prompt do PrismaAPP</text></g>
  <g class="nt"><rect x="760" y="40" width="200" height="56" rx="8"/><text class="t" x="860.0" y="64.0" text-anchor="middle">Valida o SQL</text><text class="s" x="860.0" y="83.0" text-anchor="middle">1 SELECT, só a view</text></g>
  <g class="nt"><rect x="760" y="170" width="200" height="56" rx="8"/><text class="t" x="860.0" y="194.0" text-anchor="middle">Executa</text><text class="s" x="860.0" y="213.0" text-anchor="middle">só leitura, até 3 s</text></g>
  <g class="dd"><rect x="520" y="170" width="200" height="56" rx="8"/><text class="t" x="620.0" y="194.0" text-anchor="middle">Banco da Pluggy</text><text class="s" x="620.0" y="213.0" text-anchor="middle">vw_registers</text></g>
  <g class="ex"><rect x="280" y="170" width="200" height="56" rx="8"/><text class="t" x="380.0" y="194.0" text-anchor="middle">Gemini redige</text><text class="s" x="380.0" y="213.0" text-anchor="middle">com o resultado</text></g>
  <g class="nt"><rect x="40" y="170" width="200" height="56" rx="8"/><text class="t" x="140.0" y="194.0" text-anchor="middle">Guardião do R$</text><text class="s" x="140.0" y="213.0" text-anchor="middle">todo R$ vem dos dados</text></g>
  <path class="seta" d="M240 68 L276 68" marker-end="url(#seta)"/>
  <path class="seta" d="M480 68 L516 68" marker-end="url(#seta)"/>
  <path class="seta" d="M720 68 L756 68" marker-end="url(#seta)"/>
  <path class="seta" d="M860 96 L860 166" marker-end="url(#seta)"/>
  <path class="seta" d="M760 198 L724 198" marker-end="url(#seta)"/>
  <path class="seta" d="M520 198 L484 198" marker-end="url(#seta)"/>
  <path class="seta" d="M280 198 L244 198" marker-end="url(#seta)"/>
  <path class="seta trac" d="M960 198 L985 198 L985 20 L620 20 L620 36" marker-end="url(#seta)"/>
  <rect x="716" y="2" width="168" height="18" fill="#FFFFFF"/>
  <text class="l" x="800" y="15" text-anchor="middle">erro no banco: 1 correção</text>
  <rect class="grupo" x="40" y="270" width="920" height="34" rx="10"/><text class="g" x="54" y="290">código reaproveitado do PrismaAPP: prompt, exemplos, filtro e validação (PrismaAPP/agent/src)</text>
  <rect x="40" y="321" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text class="l" x="60" y="332">agente ou ferramenta MCP</text>
  <rect x="256.0" y="321" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text class="l" x="276.0" y="332">etapa em Python</text>
  <rect x="409.0" y="321" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-dasharray="4 3"/><text class="l" x="429.0" y="332">fora da máquina ou opcional</text>
  <rect x="646.0" y="321" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text class="l" x="666.0" y="332">dados na máquina</text>
</svg>
