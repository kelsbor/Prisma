<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Arquitetura do Prisma</title>
  <desc>A Pluggy (Open Finance) alimenta, pelo agente-sql, um banco local somente leitura. Três agentes MCP locais: Consultas responde com SQL validado sobre esse banco, Especialista explica com RAG e usa o resumo do mês e o Agente de Indicadores (Banco Central). O assistente do PrismaAPP atende o app.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 15px; font-weight: 600; }  .s { font-size: 12.5px; }  .l { font-size: 12px; fill: #5F5E5A; }
      .g { font-size: 13px; font-weight: 600; fill: #5F5E5A; }
      .ag rect { fill: #EEEDFE; stroke: #534AB7; } .ag .t { fill: #3C3489; } .ag .s { fill: #534AB7; }
      .dd rect { fill: #E1F5EE; stroke: #0F6E56; } .dd .t { fill: #085041; } .dd .s { fill: #0F6E56; }
      .nt rect { fill: #F1EFE8; stroke: #5F5E5A; } .nt .t { fill: #2C2C2A; } .nt .s { fill: #444441; }
      .rn rect { fill: #FAEEDA; stroke: #854F0B; } .rn .t { fill: #633806; } .rn .s { fill: #854F0B; }
      .ex rect { fill: #FFFFFF; stroke: #5F5E5A; stroke-dasharray: 6 4; } .ex .t { fill: #2C2C2A; } .ex .s { fill: #444441; }
      .seta { stroke: #5F5E5A; stroke-width: 1.4; fill: none; }  .trac { stroke-dasharray: 6 4; }
      .grupo { fill: none; stroke: #B4B2A9; stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect width="1000" height="620" fill="#FFFFFF"/>
  <g class="ex"><rect x="40" y="30" width="210" height="56" rx="8"/><text class="t" x="145.0" y="54.0" text-anchor="middle">Pluggy</text><text class="s" x="145.0" y="73.0" text-anchor="middle">Open Finance</text></g>
  <g class="nt"><rect x="395" y="30" width="210" height="56" rx="8"/><text class="t" x="500.0" y="54.0" text-anchor="middle">Pessoa</text><text class="s" x="500.0" y="73.0" text-anchor="middle">terminal, VS Code ou app</text></g>
  <g class="ex"><rect x="750" y="30" width="210" height="56" rx="8"/><text class="t" x="855.0" y="54.0" text-anchor="middle">Gemini</text><text class="s" x="855.0" y="73.0" text-anchor="middle">texto e SQL · opcional</text></g>
  <g class="nt"><rect x="40" y="140" width="210" height="56" rx="8"/><text class="t" x="145.0" y="164.0" text-anchor="middle">agente-sql</text><text class="s" x="145.0" y="183.0" text-anchor="middle">./prisma.sh pluggy</text></g>
  <g class="ex"><rect x="750" y="140" width="210" height="56" rx="8"/><text class="t" x="855.0" y="164.0" text-anchor="middle">PrismaAPP</text><text class="s" x="855.0" y="183.0" text-anchor="middle">app Android</text></g>
  <rect class="grupo" x="20" y="228" width="960" height="120" rx="10"/><text class="g" x="34" y="248">serviços locais</text>
  <g class="ag"><rect x="40" y="270" width="200" height="56" rx="8"/><text class="t" x="140.0" y="294.0" text-anchor="middle">Consultas</text><text class="s" x="140.0" y="313.0" text-anchor="middle">8006 · SQL validado</text></g>
  <g class="ag"><rect x="280" y="270" width="200" height="56" rx="8"/><text class="t" x="380.0" y="294.0" text-anchor="middle">Especialista</text><text class="s" x="380.0" y="313.0" text-anchor="middle">8002 · RAG</text></g>
  <g class="ag"><rect x="520" y="270" width="200" height="56" rx="8"/><text class="t" x="620.0" y="294.0" text-anchor="middle">Indicadores</text><text class="s" x="620.0" y="313.0" text-anchor="middle">8004 · Banco Central</text></g>
  <g class="ag"><rect x="760" y="270" width="200" height="56" rx="8"/><text class="t" x="860.0" y="294.0" text-anchor="middle">Assistente do app</text><text class="s" x="860.0" y="313.0" text-anchor="middle">8010 · text-to-SQL</text></g>
  <g class="dd"><rect x="40" y="410" width="200" height="56" rx="8"/><text class="t" x="140.0" y="434.0" text-anchor="middle">Banco da Pluggy</text><text class="s" x="140.0" y="453.0" text-anchor="middle">~/.prisma/app</text></g>
  <g class="dd"><rect x="280" y="410" width="200" height="56" rx="8"/><text class="t" x="380.0" y="434.0" text-anchor="middle">Chroma</text><text class="s" x="380.0" y="453.0" text-anchor="middle">índice vetorial</text></g>
  <g class="ex"><rect x="520" y="410" width="200" height="56" rx="8"/><text class="t" x="620.0" y="434.0" text-anchor="middle">Banco Central</text><text class="s" x="620.0" y="453.0" text-anchor="middle">API pública</text></g>
  <g class="dd"><rect x="280" y="510" width="200" height="56" rx="8"/><text class="t" x="380.0" y="534.0" text-anchor="middle">base_conhecimento/</text><text class="s" x="380.0" y="553.0" text-anchor="middle">37 materiais</text></g>
  <path class="seta" d="M145 86 L145 136" marker-end="url(#seta)"/>
  <path class="seta" d="M40 168 L26 168 L26 438 L36 438" marker-end="url(#seta)"/>
  <rect x="30" y="201" width="40" height="18" fill="#FFFFFF"/>
  <text class="l" x="34" y="214" text-anchor="start">grava</text>
  <path class="seta" d="M420 86 L420 266" marker-end="url(#seta)"/>
  <path class="seta trac" d="M460 270 L460 118 L855 118 L855 90" marker-end="url(#seta)"/>
  <path class="seta" d="M140 326 L140 406" marker-end="url(#seta)"/>
  <text class="l" x="148" y="372" text-anchor="start">só leitura</text>
  <path class="seta" d="M300 326 L300 370 L220 370 L220 406" marker-end="url(#seta)"/>
  <path class="seta" d="M420 326 L420 406" marker-end="url(#seta)"/>
  <path class="seta" d="M480 298 L516 298" marker-end="url(#seta)"/>
  <text class="l" x="498" y="290" text-anchor="middle">MCP</text>
  <path class="seta" d="M620 326 L620 406" marker-end="url(#seta)"/>
  <path class="seta" d="M855 196 L855 266" marker-end="url(#seta)"/>
  <path class="seta" d="M380 510 L380 470" marker-end="url(#seta)"/>
  <text class="l" x="388" y="494" text-anchor="start">indexar</text>
  <rect x="40" y="581" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text class="l" x="60" y="592">agente ou ferramenta MCP</text>
  <rect x="256.0" y="581" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text class="l" x="276.0" y="592">etapa em Python</text>
  <rect x="409.0" y="581" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text class="l" x="429.0" y="592">dados na máquina</text>
  <rect x="569.0" y="581" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-dasharray="4 3"/><text class="l" x="589.0" y="592">fora da máquina ou opcional</text>
</svg>
