<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Dados da Pluggy</title>
  <desc>O gerar_banco.py do agente-sql baixa contas, cartões e transações da Pluggy para um banco SQLite local, com a mesma vw_registers do PrismaAPP. Especialista, Consultas e agente-sql leem esse banco somente para leitura.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 15px; font-weight: 600; }  .s { font-size: 12.5px; }  .l { font-size: 12px; fill: #5F5E5A; }
      .g { font-size: 13px; font-weight: 600; fill: #5F5E5A; }
      .ag rect { fill: #EEEDFE; stroke: #534AB7; } .ag .t { fill: #3C3489; } .ag .s { fill: #534AB7; }
      .dd rect { fill: #E1F5EE; stroke: #0F6E56; } .dd .t { fill: #085041; } .dd .s { fill: #0F6E56; }
      .nt rect { fill: #F1EFE8; stroke: #5F5E5A; } .nt .t { fill: #2C2C2A; } .nt .s { fill: #444441; }
      .rn rect { fill: #FAEEDA; stroke: #854F0B; } .rn .t { fill: #633806; } .rn .s { fill: #854F0B; }
      .ex rect { fill: #FFFFFF; stroke: #5F5E5A; stroke-dasharray: 6 4; } .ex .t { fill: #2C2C2A; } .ex .s { fill: #444441; }
      .seta { stroke: #5F5E5A; stroke-width: 1.4; fill: none; }  .trac { stroke-dasharray: 6 4; }
      .grupo { fill: none; stroke: #B4B2A9; stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect width="1000" height="350" fill="#FFFFFF"/>
  <g class="ex"><rect x="40" y="40" width="200" height="56" rx="8"/><text class="t" x="140.0" y="64.0" text-anchor="middle">API da Pluggy</text><text class="s" x="140.0" y="83.0" text-anchor="middle">Open Finance</text></g>
  <g class="nt"><rect x="300" y="40" width="200" height="56" rx="8"/><text class="t" x="400.0" y="64.0" text-anchor="middle">gerar_banco.py</text><text class="s" x="400.0" y="83.0" text-anchor="middle">./prisma.sh pluggy</text></g>
  <g class="dd"><rect x="560" y="40" width="220" height="56" rx="8"/><text class="t" x="670.0" y="64.0" text-anchor="middle">Banco da Pluggy</text><text class="s" x="670.0" y="83.0" text-anchor="middle">vw_registers e contas</text></g>
  <g class="ag"><rect x="40" y="180" width="220" height="56" rx="8"/><text class="t" x="150.0" y="204.0" text-anchor="middle">Especialista</text><text class="s" x="150.0" y="223.0" text-anchor="middle">resumo do mês</text></g>
  <g class="ag"><rect x="300" y="180" width="220" height="56" rx="8"/><text class="t" x="410.0" y="204.0" text-anchor="middle">Consultas</text><text class="s" x="410.0" y="223.0" text-anchor="middle">SQL validado</text></g>
  <g class="ag"><rect x="560" y="180" width="220" height="56" rx="8"/><text class="t" x="670.0" y="204.0" text-anchor="middle">agente-sql</text><text class="s" x="670.0" y="223.0" text-anchor="middle">saldo, fatura e limite</text></g>
  <path class="seta" d="M240 68 L296 68" marker-end="url(#seta)"/>
  <path class="seta" d="M500 68 L556 68" marker-end="url(#seta)"/>
  <path class="seta" d="M580 96 L580 128 L150 128 L150 176" marker-end="url(#seta)"/>
  <path class="seta" d="M610 96 L610 145 L410 145 L410 176" marker-end="url(#seta)"/>
  <path class="seta" d="M690 96 L690 176" marker-end="url(#seta)"/>
  <rect class="grupo" x="40" y="256" width="740" height="34" rx="10"/><text class="g" x="54" y="276">arquivo local com permissão 600; os agentes abrem somente para leitura</text>
  <rect x="40" y="311" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-dasharray="4 3"/><text class="l" x="60" y="322">fora da máquina ou opcional</text>
  <rect x="277.0" y="311" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text class="l" x="297.0" y="322">etapa em Python</text>
  <rect x="430.0" y="311" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text class="l" x="450.0" y="322">dados na máquina</text>
  <rect x="590.0" y="311" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text class="l" x="610.0" y="322">agente ou ferramenta MCP</text>
</svg>
