databases:
  - name: cofre-financeiro-db
    plan: free

services:
  - type: web
    name: cofre-financeiro-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MCP_TOKEN
        generateValue: true
      - key: HASH_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false   # o Render pede o valor no deploy; gere com o comando do README
      - key: DATABASE_URL
        fromDatabase:
          name: cofre-financeiro-db
          property: connectionString
