[project]
name = "prisma-agent"
version = "0.1.0"
description = "Servidor do assistente text-to-SQL do Prisma Finanças (Gemini via LangChain)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "sqlglot>=25.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
